<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="../css/conta.css" />
</head>
<body>

<div class="container">
  <div class="login-box" id="loginBox">
    <img src="../assets/icon/Logo Suki.svg" alt="Logo_Suki.png" class="logo">

    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Senha" required />
      <select id="role" required>
        <option value="" disabled selected>Selecione o tipo de usuário</option>
        <option value="user">Usuário</option>
        <option value="admin">Administrador</option>
      </select>
      <button type="submit">Entrar</button>
    </form>
    <p id="errorMsg" class="error"></p>
  </div>

  <div class="welcome-box" id="welcomeBox" style="display:none;">
    <h2>Bem-vindo, <span id="userEmail"></span></h2>
    <p>Você está logado como <strong><span id="userRole"></span></strong></p>
    <button id="logoutBtn">Sair</button>
  </div>
</div>

<script src="../js/conta.js"></script>
<script src="../js/Backend Node.js"></script>
</body>
</html>
